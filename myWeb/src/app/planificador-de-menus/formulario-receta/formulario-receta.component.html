  <form class="flex-form">
    <div class="flex-container row">
      <div class="flex-item">
        <mat-form-field appearance="fill">
          <mat-label>Nombre del plato</mat-label>
          <input matInput placeholder="Introduce el nombre del plato" class="wide-input-container">
        </mat-form-field>
      </div>
      <div class="flex-item">
        <mat-form-field appearance="fill">
          <mat-label>Categorías</mat-label>
          <mat-select>
            <mat-option *ngFor="let categoria of categorias" [value]="categoria">
              {{ categoria }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="flex-item image-upload">
        <button mat-raised-button (click)="imageInput.click()">
          Cargar Imagen
        </button>
        <input type="file" #imageInput hidden (change)="onImageSelected($event)">
        <!-- Vista previa de la imagen cargada -->
        <img *ngIf="imageSrc" [src]="imageSrc" class="image-preview"/>
      </div>
    </div>
  
    <div class="flex-container row">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Ingredientes</mat-label>
        <textarea matInput placeholder="Introduce los ingredientes" rows="10"></textarea>
      </mat-form-field>
    </div>
  
    <div class="flex-container row">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Preparación</mat-label>
        <textarea matInput placeholder="Introduce los pasos de la preparación" rows="10"></textarea>
      </mat-form-field>
    </div>
  
    <div class="flex-container row">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Presentación</mat-label>
        <textarea matInput placeholder="Introduce la presentación del plato" rows="2"></textarea>
      </mat-form-field>
    </div>
  
    <div class="flex-container actions row">
      <button mat-raised-button color="primary" (click)="guardarReceta()">Guardar</button>
      <button mat-raised-button (click)="cerrarDialogo()">Cerrar</button>
    </div>
  </form>
